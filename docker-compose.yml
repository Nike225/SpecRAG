# Full stack, fully local: Ollama (LLM + embeddings) + FastAPI + React.
#   docker compose up -d        -> UI on http://localhost:8080
# First start pulls llama3.1:8b and nomic-embed-text (~5 GB).
services:
  ollama:
    image: ollama/ollama:latest
    volumes: [ollama:/root/.ollama]
    ports: ["11434:11434"]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      retries: 30

  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      ollama: { condition: service_healthy }
    environment: { OLLAMA_HOST: "ollama:11434" }
    entrypoint: ["sh", "-c", "ollama pull nomic-embed-text && ollama pull ${LLM_MODEL:-llama3.1:8b}"]
    volumes: [ollama:/root/.ollama]
    restart: "no"

  backend:
    build: ./backend
    depends_on:
      ollama-pull: { condition: service_completed_successfully }
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LLM_MODEL: ${LLM_MODEL:-llama3.1:8b}
      EMBED_PROVIDER: ${EMBED_PROVIDER:-ollama}
      EMBED_MODEL: ${EMBED_MODEL:-nomic-embed-text}
      OLLAMA_URL: http://ollama:11434
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      INDEX_DIR: /data/index
    volumes: [index:/data/index]
    ports: ["8000:8000"]

  frontend:
    build: ./frontend
    depends_on: [backend]
    ports: ["8080:80"]

volumes:
  ollama:
  index:
